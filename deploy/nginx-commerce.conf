# /etc/nginx/sites-enabled/commerce.conf on the live server — its own file, so Chithii's chithii.conf and the
# customer-address script (/etc/nginx/chithii-customers/) never rewrite it.
# The certificate comes first (see the plan, step 4); until it exists only the port-80 block may be enabled.

server {
    listen 80;
    listen [::]:80;
    server_name commerce.chithii.com;
    include snippets/chithii-acme.conf;
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name commerce.chithii.com;
    ssl_certificate     /etc/letsencrypt/live/commerce.chithii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commerce.chithii.com/privkey.pem;

    client_max_body_size 20m;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The API: /api/v1/... (dashboard calls, Chithii's provisioning, sign-in and reads) and its health checks.
    location /api/   { proxy_pass http://127.0.0.1:5250; }
    location /health { proxy_pass http://127.0.0.1:5250; }

    # Everything else is the Next.js dashboard.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
